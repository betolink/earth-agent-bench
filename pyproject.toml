[project]
name = "earth-agent-bench"
version = "0.1.0"
description = "Access-pattern selection benchmark for AI agents working with NASA Earthdata"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "earth-agent-bench contributors" }]
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "typer>=0.12",
    "rich>=13.7",
]

[project.scripts]
eab = "earth_agent_bench.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/earth_agent_bench"]

[dependency-groups]
dev = [
    "harbor>=0.24,<0.25",
    "pytest>=8.2",
]
agent = [
    "earthaccess>=0.18",
    "virtualizarr",
    "icechunk",
    "xarray",
    "dask[distributed]",
    "h5netcdf",
    "netCDF4",
    "fsspec",
    "s3fs",
    "zarr",
    "pydap",
    "harmony-py",
    "rioxarray",
    "geopandas",
    "pyarrow",
    "matplotlib",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Correctness (E/F/W) + import order (I) + a few bugbear (B) checks.
select = ["E4", "E7", "E9", "F", "W", "I", "B"]
# B008: typer/click use function calls in argument defaults by design.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Container-side verifier scripts inject sys.path before importing vendored modules.
"src/earth_agent_bench/harbor/runtime/*.py" = ["E402"]
# Test helpers build deliberately long literals.
"tests/*.py" = ["E501"]
