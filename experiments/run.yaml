version: 1

# Experiment name — recorded in runs/manifests/<name>-<stamp>.json and shown by
# `eab config`, `eab index`, and `eab trajectory`, so results are attributable.
# Override with EAB_RUN_NAME. Use a distinct name when you change the setup
# (e.g. timeout, sampling) so runs stay comparable.
name: eab-full
# Master run config — WHAT to benchmark.
#
# How to configure the benchmark for your own models:
#   1. Set the environment contract (see docs/quickstart.md):
#        EARTHDATA_TOKEN, LITE_LLM_ENDPOINT, LITE_LLM_API_KEY
#   2. Describe your models in experiments/models.yaml (the roster): for each
#      model add  <id>:  { tier: local, litellm_model: "<gateway model name>" , ... }
#      The `litellm_model` must be a model your gateway serves (eab models discover).
#   3. List the <id>s (and harnesses/conditions) to run below.
#   4. Run it:   bash scripts/eab-full-run.sh      (or: eab config to preview)
#
# Everything here is overridable by env: EAB_MODELS, EAB_HARNESSES,
# EAB_CONDITIONS, EAB_TASKS (comma-separated).

# Roster ids from experiments/models.yaml to benchmark.
models: [tiel-coder-35b, ornith-1.5-9b]
# Harness CLIs crossed with every model.
harnesses: [pi, opencode, codex-cli]

# Knowledge conditions (defined in experiments/conditions.yaml).
# Order matters: `improve` runs LAST so the model's self-improvement skill can be
# generated (eab postmortem) from its baseline/mcp/skills/mcp-skills runs first.
conditions: [baseline, mcp, skills, mcp-skills, improve]

# Tasks: 'all' (18 grounded tasks) or a list of sphere/task ids.
tasks: all

# Trials per cell.
trials: 1

# How many cells to run at once.
#   1  = sequential — correct for a single local GPU (the model server is
#        single-slot; parallel agents would just queue/contend).
#   >1 = parallel — for models served remotely through the gateway (API
#        providers) where the endpoint handles concurrent requests.
# Override with EAB_CONCURRENCY. (Within a cell, Harbor runs one trial at a time.)
concurrency: 1
