version: 1

gateway:
  type: litellm
  # Default endpoint; override with LITE_LLM_ENDPOINT (preferred) or LITELLM_BASE_URL.
  base_url: http://localhost:4000
  api_key_env: LITE_LLM_API_KEY
  note: >
    Single LiteLLM gateway serving all models (local and API). Local models are
    namespaced `local/...`, API models under their provider prefix (zai/, copilot/,
    opencode-go/, deepseek/). Query live names with `eab models discover`.
  discover_endpoint: /v1/models

budget:
  closed_reference:
    shared_cap_usd: 100.0
    hard_stop: true
    accounting: per-run cost recorded in RunManifest; cumulative stop enforced by the runner

tiers: [local, frontier_open, closed_reference]

defaults:
  sampling: {temperature: 0.2, top_p: 0.95}

models:
  lfm2.5-2.6b:
    tier: local
    display_name: LFM2.5 2.6B (edge floor)
    litellm_model: local/LFM2.5-2.6B
    repo: DavidAU/LFM2.5-2.6B-Qwen3.8-Turbo-Brilliance-Power-X12-NEO-MAX-GGUF
    quantization: MAX-Q6_K
    context: 131072
    vram_estimate_gb: 2.5
    serving:  # how it is actually served (from clusterfunk/intelligence-index)
      served_context: 180000
      kv: q8_0
      gpu: single
      mtp: false
      thinking: none        # served template has no enable/effort toggle
    findings:
      - 5/6 base and 5/5 hard agentic pass; fastest model (138->103 tok/s)
      - reasoning channel can consume the token budget; give JSON probes headroom
    notes:
      - pin exactly one reasoning mode for the whole experiment (template ships 14; default 'high')

  ornith-1.5-9b:
    tier: local
    display_name: Ornith 1.5 9B (dense)
    litellm_model: local/Ornith-1.5-9B
    repo: ornith-ai/Ornith-1.5-9B-GGUF
    quantization: Q6_K
    context: null
    vram_estimate_gb: 8.0
    serving:
      served_context: 180000
      kv: q8_0
      gpu: single
      mtp: false
      thinking: enable        # enable_thinking, effort medium
    findings:
      - 6/6 base with thinking ON; 4/6 OFF (thinking OFF hurts T1/T2)
      - 55->46 tok/s; passes tool + JSON probes
    notes:
      - confirm context length from model card at pilot

  muse-glimmer-30b:
    tier: local
    display_name: Muse Glimmer 30B
    litellm_model: local/Muse-Glimmer-30B
    repo: local/Muse-Glimmer-30B
    quantization: UD-Q4_K_XL
    context: 180000
    vram_estimate_gb: 20.0
    serving:
      served_context: 180000
      kv: q8_0
      gpu: dual
      mtp: false
      thinking: effort
    findings:
      - 6/6 base and 6/6 OFF in intelligence-index; 20->17 tok/s

  gpt-oss-20b:
    tier: local
    display_name: gpt-oss 20B
    litellm_model: local/gpt-oss-20b
    repo: openai/gpt-oss-20b
    quantization: MXFP4
    context: 131072
    vram_estimate_gb: 13.0
    notes:
      - reasoning effort pinned (medium) across all runs

  deepseek-qwen3.5-9b-mtp:
    tier: local
    display_name: DeepSeek Qwen3.5 9B (MTP)
    litellm_model: local/DeepSeek-Qwen3.5-9B-MTP
    repo: local merge (DeepSeek-V4-Pro-Qwen3.5-9B-MTP)
    quantization: Q4_K_M
    context: 180000
    vram_estimate_gb: 6.0
    serving:
      served_context: 180000
      kv: q8_0
      gpu: single
      mtp: true
      thinking: effort   # reasoning_effort (medium)
    findings:
      - best small in intelligence-index: 6/6 base and 5/5 hard, BOTH thinking modes
      - 76.9->52.5 tok/s single-GPU MTP; fits 180k/q8 on one GPU
    notes:
      - MTP spec-decode materially helps; dual-GPU split is slower at low depth

  qwen3.8-27b-gsq:
    tier: local
    display_name: Qwen3.8 27B GSQ-RCO (research quant)
    litellm_model: local/Qwen3.8-27B
    repo: ISTA-DASLab/Qwen3.8-27B-GSQ-RCO-GGUF
    quantization: IQ3_S (GSQ/RCO mixed precision)
    context: 262144
    vram_estimate_gb: 13.5
    confirm_at_pilot: GSQ-RCO variant not on the gateway; mapped to local/Qwen3.8-27B — confirm the intended quant
    notes:
      - record average bit width per tensor-allocation report in RunManifest
      - mtp variant enables llama.cpp speculative decoding

  tiel-coder-35b:
    tier: local
    display_name: Tiel Coder 35B A3B (local flagship)
    litellm_model: local/Tiel-Coder-35B-A3B
    repo: peculiar-ragdoll/Tiel-Coder-35B-A3B-GGUF-MTP
    quantization: IQ4_XS (24GB GPU) / IQ3_XXS (16GB GPU)
    context: null
    vram_estimate_gb: 20.0
    notes:
      - confirm context length from model card at pilot
      - text-only mode

  deepseek-flash-4.1:
    tier: frontier_open
    display_name: DeepSeek Flash 4.1
    litellm_model: opencode-go/deepseek-v4.1-flash
    confirm_at_pilot: confirm the intended DeepSeek flash model (v4.1 vs v4-flash)
    context: null

  glm-5.3-flash:
    tier: frontier_open
    display_name: GLM 5.3 Flash
    litellm_model: zai/glm-5.3-flash
    context: null

  qwen3.8-flash:
    tier: frontier_open
    display_name: Qwen3.8 Flash (OpenCode Go)
    litellm_model: opencode-go/qwen3.8-flash
    context: null
    notes:
      - OpenCode Go tier; non-training, 0-day retention
      - ~$0.15/M in, $0.47/M out, $0.016/M cached-read; heavy prefix caching

  claude-sonnet-5-5:
    tier: closed_reference
    display_name: Claude Sonnet 5.5 (reference)
    litellm_model: copilot/claude-sonnet-5.5
    context: null
    notes:
      - only model permitted on the claude-code lane
      - subject to closed_reference shared budget cap

  gpt-sol:
    tier: closed_reference
    display_name: GPT Sol (reference)
    litellm_model: copilot/gpt-6.1-sol
    confirm_at_pilot: confirm the intended Sol model (gpt-6.1-sol vs gpt-6-sol vs gpt-5.6-sol)
    context: null
    notes:
      - subject to closed_reference shared budget cap
