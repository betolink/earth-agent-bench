task_id: land-surface/l3-iowa-drought-2022
science_sphere: land-surface
title: Iowa 2022 drought from SMAP soil moisture and MODIS ET
discipline_workflow:
  - Identify SPL4SMGP and MOD16A2
  - Access Apr-Oct 2018-2022 for both collections
  - Align grids and units (9 km SMAP vs 500 m MODIS)
  - Compute 2022 z-score anomalies vs climatology
  - Drought-index map and series
  - Save NetCDF artifact
access_requirement:
  kind: virtualize
  description: >
    Growing-season drought characterization for the Iowa Corn Belt: 2022 soil
    moisture and evapotranspiration anomalies vs the 2018-2022 climatology.
  spatial_extent: {type: bbox, coordinates: [-96.6, 40.3, -90.0, 43.6]}
  temporal_extent: {start: 2018-04-01, end: 2022-10-31}
  demo_scope: {days: 30, note: "one month"}
  variables_of_interest: [soil_moisture, et]
  output_format: netcdf
collections:
  - short_name: SPL4SMGP
    concept_id: C3480440870-NSIDC_CPRD
    tier: preferred
    role: primary
    services:
      - {pattern: C1, available: false, grade: B, source: edvs-parquet, reason: "time var without time dim; cube-able via store build"}
      - {pattern: S1, available: true, source: "catalog; verify via CMR"}
  - short_name: MOD16A2
    concept_id: C2343113232-LPCLOUD
    tier: preferred
    role: secondary
    services:
      - {pattern: S1, available: true, source: "catalog; verify via CMR"}
pattern_tiers:
  best: [C1]
  acceptable: [S1, S3, S2]
  marginal: [F1, F2]
  inefficient: [M1, M2]
validation:
  units: m3 m-3
  aggregation: zscore_anomaly
  checks: [variable_present, spatial_extent_correct, temporal_extent_correct, units_correct]
gold:
  primary_patterns: [C1]
  acceptable_patterns: [S1, S3, S2]
  reasoning: >
    Verified availability — C1=y, S1=y, S2=n, S3=n, S4=y. Preference: virtualization > S1 > OPeNDAP > HTTP-subset > download; AppEEARS/Giovanni excluded.
notes:
  - temporal_extent covers the climatology baseline; the 2022 anomaly window is described in the requirement
