task_id: cryosphere/c2-prefire-modis-greenland-2024
science_sphere: cryosphere
title: PREFIRE and MODIS cloud-screened collocation, Greenland winter 2024
discipline_workflow:
  - Identify PREFIRE_SAT1_1B-RAD and MOD35_L2 cloud mask
  - Subset each collection to Greenland and Jan-Mar 2024
  - Time/space match footprints to MODIS pixels (30 min, 25 km)
  - Apply MODIS cloud mask to PREFIRE footprints
  - Save matched table as Parquet
access_requirement:
  description: >
    Collocate PREFIRE far-IR radiance with cloud-cleared MODIS observations
    over Greenland during winter 2024 for a validation study.
  spatial_extent: {type: bbox, coordinates: [-55.0, 59.0, -20.0, 84.0]}
  temporal_extent: {start: 2024-01-01, end: 2024-03-31}
  variables_of_interest: [prefire_radiance, modis_cloud_fraction]
  output_format: parquet
collections:
  - short_name: PREFIRE_SAT1_1B-RAD
    concept_id: C3523946238-LARC_CLOUD
    tier: preferred
    role: primary
    services:
      - {pattern: C1, available: false, reason: "EDVS grade unknown (not sampled)"}
      - {pattern: S1, available: true, source: "catalog; verify via CMR"}
  - short_name: MOD35_L2
    concept_id: C1443561895-LAADS
    tier: preferred
    role: secondary
    services:
      - {pattern: S2, available: true, source: "catalog: LAADS; verify via CMR"}
pattern_tiers:
  best: [S1]
  acceptable: [S3, S2]
  marginal: [F1, F2]
  inefficient: [M1, M2]
validation:
  units: W m-2 sr-1 um-1
  aggregation: collocation_table
  checks: [variable_present, spatial_extent_correct, temporal_extent_correct, units_correct]
gold:
  primary_patterns: [S1]
  acceptable_patterns: [S3, S2]
  reasoning: >
    Verified availability — C1=n, S1=y, S2=y, S3=n, S4=n. Preference: virtualization > Harmony > OPeNDAP > HTTP-subset > download; AppEEARS/Giovanni excluded.
