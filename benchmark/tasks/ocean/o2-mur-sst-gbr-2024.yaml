  spatial_extent: {type: bbox, coordinates: [142.0, -25.0, 155.0, -8.0]}
  temporal_extent: {start: 2023-12-01, end: 2024-03-31}
  variables_of_interest: [analysed_sst]
  output_format: netcdf
collections:
  - short_name: MUR-JPL-L4-GLOB-v4.1
    concept_id: C1996881146-POCLOUD
    tier: preferred
    role: main
    services:
      - {pattern: C1, available: false, grade: B, source: edvs-parquet, reason: "analysed_sst stable across granules; cube available"}
      - {pattern: S3, available: true, source: "edvs-parquet:dmrpp"}
      - {pattern: S1, available: true, source: "catalog; verify via CMR"}
  - short_name: MUR25-JPL-L4-GLOB-v4.1
