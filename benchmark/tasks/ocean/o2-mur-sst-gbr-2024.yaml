  acceptable_patterns: [S1, S3, S2]
  reasoning: >
    Verified availability — C1=y, S1=y, S2=y, S3=n, S4=n. Preference: virtualization > Harmony > OPeNDAP > HTTP-subset > download; AppEEARS/Giovanni excluded.
